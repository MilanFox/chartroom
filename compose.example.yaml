services:
  chartroom:
    container_name: chartroom
    image: ghcr.io/milanfox/chartroom:1.0.0
    env_file: .env
    environment:
      # Published on loopback only, so every request arrives through the reverse proxy; trust its forwarded headers.
      CHARTROOM_TRUST_PROXY: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - chartroom-data:/data
    init: true
    restart: unless-stopped

volumes:
  chartroom-data:
