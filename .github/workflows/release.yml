name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Check the tag against the manifests
        run: node scripts/check-version.ts "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  image:
    needs: gate
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/milanfox/chartroom
    steps:
      - uses: actions/checkout@v5
      - name: Derive the version
        id: version
        run: echo "full=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build the image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: chartroom:smoke
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Check the image reports the tag version on /health
        env:
          VERSION: ${{ steps.version.outputs.full }}
        run: |
          docker run -d --name chartroom-smoke -p 3000:3000 \
            -e CHARTROOM_ADMIN_PASSWORD=smoke-admin -e CHARTROOM_VIEWER_PASSWORD=smoke-viewer chartroom:smoke
          for _ in $(seq 30); do
            health="$(curl -fsS http://127.0.0.1:3000/health)" && break
            sleep 2
          done
          docker rm -f chartroom-smoke
          echo "health: $health"
          test "$(jq -r .version <<< "$health")" = "$VERSION"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.full }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
      - name: Record the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/milanfox/chartroom
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check the tag against the manifests
        run: node scripts/check-version.ts "$GITHUB_REF_NAME"
      - name: Derive the version tags
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "full=$version"
            echo "minor=${version%.*}"
            echo "major=${version%%.*}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-arch image
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:${{ steps.version.outputs.full }}" \
            -t "$IMAGE:${{ steps.version.outputs.minor }}" \
            -t "$IMAGE:${{ steps.version.outputs.major }}" \
            -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${{ steps.version.outputs.full }}"

      - run: npm ci
      - run: npm run build --workspace cli
      - name: Publish the CLI to npm
        run: |
          if npm view "chartroom-cli@${{ steps.version.outputs.full }}" version > /dev/null 2>&1; then
            echo "chartroom-cli@${{ steps.version.outputs.full }} is already on npm"
          else
            npm install --global npm@latest
            npm publish --workspace cli --access public
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.ts "$GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
